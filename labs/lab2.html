<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <!-- ลงทะเบียนร้านค้า -->
      <div class="heading">
        <h1>ลงทะเบียนร้านค้า</h1>
        <p>กรุนากรอกข้อมูลให้ครบถ้วนเพื่อลงทะเบียนร้านค้าของคุณ</p>
      </div>
      <div class="formFrame">
        <div class="subHeader">
          <h2>ข้อมูลเจ้าของร้าน</h2>
        </div>
        <br />
        <div class="inputWraper">
          <label for="name">ชื่อ-นามสกุลเจ้าของร้าน:</label>
          <input
            type="text"
            id="name"
            placeholder="กรอกชื่อ-นามสกุล"
            name="name"
            required=""
          /><br />
        </div>

        <label for="store">ชื่อร้าน:</label>
        <input
          type="text"
          id="store"
          placeholder="กรอกชื่อร้าน"
          name="store"
          required=""
        /><br />

        <label for="phone">เบอร์โทรศัพท์:</label>
        <input
          type="number"
          id="phone"
          placeholder="0XX-XXX-XXXX"
          name="phone"
          required=""
        /><br />

        <label for="email">อีเมล:</label>
        <input
          type="email"
          id="email"
          placeholder="กรอกอีเมล"
          name="email"
          required=""
        /><br />

        <label for="password">รหัสผ่าน:</label>
        <input
          type="password"
          id="password"
          placeholder="กรอกรหัสผ่าน"
          name="password"
          required=""
        /><br />
    </form>
  </body>
</html>
